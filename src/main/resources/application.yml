spring:
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      # 单张 5MB、最多 9 张，理论上限 45MB。
      # 原来写 20MB，用户选 6 张手机直出图就整体 413 —— 前端只校验了单张体积，
      # 不会提示「总共超了」，所以必须让请求上限容得下最坏情况，否则这条限制是假的。
      max-file-size: 5MB
      max-request-size: 48MB

  # 表结构版本控制。迁移脚本在 src/main/resources/db/migration，命名 V<版本>__<说明>.sql
  # 规则：脚本一旦被执行过就不要再改内容（Flyway 会校验 checksum，改了直接启动失败），
  #      要调整结构就新增一个 V2、V3，历史只往后长。
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 首次接入时库里的表是手工建的，Flyway 不知道，会把「当前结构」当成 baseline 记录一条，
    # 然后把 version <= baseline-version 的脚本跳过。线上空库不会触发 baseline，V1 会真正执行建表。
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: 接入 Flyway 前的现有结构
    validate-on-migrate: true
    # 禁止 clean（会清空整个库），防误操作
    clean-disabled: true

  # 注册验证码邮件：QQ 邮箱 SMTP。账号与授权码走环境变量，未配置时退化为「日志打印验证码」本地联调模式
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_AUTH_CODE:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 上传目录与访问前缀（FileUtil 读取）。
# 本地默认 D:/uploads/（Windows 绝对路径）；线上用 UPLOAD_DIR=/data/uploads 覆盖。
# 注意：务必是绝对路径 —— 在 Linux 上写盘符会被当成相对路径，
# 图片写进工作目录下的「D:」文件夹，nginx 找不到文件，全站破图且不报错。
# StartupCheck 会在启动时拦下这种情况。
file:
  upload-dir: ${UPLOAD_DIR:D:/uploads/}
  url-prefix: /images/

app:
  share:
    # 分享卡片里的绝对地址根（og:url / og:image）。留空则按请求自动推导
    base-url: ${SHARE_BASE_URL:}
  mail:
    # 发件人显示名与地址；留空时取 spring.mail.username
    from-name: ${MAIL_FROM_NAME:尘叙阁}
    from: ${MAIL_FROM:}
  # 图片回收：软删满 N 天后物理删除 moment_image 行与磁盘文件
  photo:
    purge-enabled: ${PHOTO_PURGE_ENABLED:true}
    purge-days: ${PHOTO_PURGE_DAYS:30}
    # 每天 03:40，避开备份（03:00）与访问高峰
    purge-cron: ${PHOTO_PURGE_CRON:0 40 3 * * ?}

# 健康检查：只暴露 health，且不显示细节（内部监控只需要 UP/DOWN）
# 注意 nginx 只反代了 /api/ 与静态文件，actuator 不会暴露到公网
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # 关掉邮件探针：它每次都会真的连一次 QQ SMTP，而邮件只是注册/找回密码的旁路，
    # 挂了不影响看帖发帖。开着的话 SMTP 抖一下整个 health 变 DOWN，
    # 监控就会去重启一个其实完全正常的服务（这条在本地已经实测踩到过）。
    mail:
      enabled: false

# 接口文档（Swagger UI）：/swagger-ui/index.html，规范原文 /v3/api-docs
# 本地默认开，生产默认关（application-prod.yml 里覆盖成 false）。
# 关掉的原因：文档等于把全部接口、参数结构、错误码公开，不该对公网可见。
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
    # 刻意不配 tags-sorter：分组顺序由 OpenApiConfig 里的中文分组表决定，
    # 一旦按字母序排，中文名会被按 unicode 码点乱序，业务顺序就没了

