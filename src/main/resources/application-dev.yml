server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sharing}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    # 本地开发给了默认值方便直接跑；配了同名环境变量会自动覆盖，方便多人共用一套配置
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:666666}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 1000ms

jwt:
  secret: ${JWT_SECRET:this-is-a-very-long-secret-key-for-your-jwt-token-1234567890}
  expire: ${JWT_EXPIRE:604800000}

# 本地开发允许 Vite 开发服务器跨域访问（生产同域部署时留空即关闭）
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
