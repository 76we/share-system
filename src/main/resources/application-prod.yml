server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://线上MySQL地址:3306/sharing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: 线上数据库账号
    password: 线上数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 云Redis内网地址
      port: 6379
      password: 线上Redis密码
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 30
          max-idle: 15
          min-idle: 5
          max-wait: 2000ms

jwt:
  secret: 【这里换成全新、复杂的密钥！不要和dev一样！】
  expire: 604800000
