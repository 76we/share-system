# 尘叙阁 · Nginx 站点配置
# 放置位置：/etc/nginx/conf.d/share-system.conf
# 改完执行：nginx -t && systemctl reload nginx
#
# 目录约定（与 DEPLOY.md 保持一致）：
#   前端静态包  /opt/share/frontend/dist
#   后端 jar    /opt/share/share-system.jar
#   上传图片    /opt/share/uploads/

server {
    listen 80;
    server_name your.domain.com;   # ← 换成你的域名或公网 IP

    root /opt/share/frontend/dist;
    index index.html;

    # 上传大小与后端一致（application.yml 里 max-request-size: 20MB）
    client_max_body_size 20m;

    # ---------- 前端：Vue Router history 模式 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端接口 ----------
    # /api/moments/list → http://127.0.0.1:8080/moments/list
    # proxy_pass 末尾的 "/" 就是去掉 /api 前缀的关键，不能漏
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- 上传的图片 ----------
    # 推荐直接由 nginx 读磁盘（比走后端快，也不占用 Tomcat 线程）
    # 注意：/opt/share/uploads/ 必须与 share-system.env 里的 UPLOAD_DIR 完全一致
    location /images/ {
        alias /opt/share/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 前端 gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
}
