# 尘叙阁 · Nginx 站点配置
# 放置位置：/etc/nginx/conf.d/share-system.conf
# 改完执行：nginx -t && systemctl reload nginx
#
# 目录约定（与 DEPLOY.md 保持一致）：
#   前端静态包  /opt/share/frontend/dist
#   后端服务    Docker Compose 发布到 127.0.0.1:8080，nginx 反代过去
#   上传图片    /data/uploads/（数据盘，不在 /opt 下）

server {
    listen 80;
    server_name your.domain.com;   # ← 换成你的域名或公网 IP

    root /opt/share/frontend/dist;
    index index.html;

    # 上传大小与后端一致（application.yml 里 max-request-size: 48MB）
    # 单张 5MB × 最多 9 张 = 45MB，留 3MB 给表单字段；设小了会在 nginx 层直接 413，
    # 前端拿不到后端的友好提示。
    client_max_body_size 48m;

    # ---------- 前端：Vue Router history 模式 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端接口 ----------
    # /api/moments/list → http://127.0.0.1:8080/moments/list
    # proxy_pass 末尾的 "/" 就是去掉 /api 前缀的关键，不能漏
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # X-Real-IP 必须是 $remote_addr（nginx 覆盖写入，客户端伪造不了）。
        # 后端 IpUtil 优先读它来做登录锁定与浏览量去重；
        # 如果这里改成 $http_x_real_ip 或让客户端透传，限流与去重就直接失效。
        proxy_set_header X-Real-IP $remote_addr;
        # XFF 只用于排查日志，不要再拿它当 IP 来源（$proxy_add_x_forwarded_for 会把客户端自带的原值拼在最前）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- 上传的图片 ----------
    # 直接由 nginx 读磁盘（比走后端快一个数量级，也不占用 Tomcat 线程）
    # 注意：/data/uploads/ 必须与 share-system.env 里的 UPLOAD_DIR 完全一致，
    # 且两边结尾的斜杠都不能少 —— 少一个会拼成 /data/uploadsuuid.jpg
    location /images/ {
        alias /data/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        # 用户上传内容不允许被浏览器猜类型（防止把伪装文件当 HTML 执行）
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # 前端 gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
}
