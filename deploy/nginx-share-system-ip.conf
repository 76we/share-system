# 尘叙阁 · 未备案期间的临时站点配置（只有公网 IP，没有域名）
#
# 【什么时候用】
#   服务器已买好、ICP 备案还在管局审核（7–20 天）时用这一份。
#   这个阶段把域名解析到内地服务器，80/443 会被拦成「未备案提示页」，
#   只能走非标端口，所以这里监听 8080。
#
# 【配套要改一处】
#   根目录 .env 里写 BACKEND_PORT=8081 —— 让后端从 8080 退到 8081，
#   把 8080 让给 nginx 对外。忘记改会报 "address already in use"。
#
# 【放置位置】
#   /etc/nginx/conf.d/share-system.conf
#
# 【备案通过后】
#   换成 nginx-share-system.conf，本文件删除。切换步骤见 DEPLOY.md §6.0。
#
# 【安全提醒】
#   8080 是纯 HTTP，登录密码和 JWT 在公网上是明文传输。
#   这个阶段只用来自己验收和给熟人看，别对外公布，也别用真实常用密码注册。

server {
    # 非标端口：内地服务器未备案时，80/443 上的域名会被强制拦截，
    # 但直接访问 IP 的 8080 通常可用（这是开发调试的常规做法，不是官方承诺）。
    listen 8080;

    # 下划线表示「匹配任意 Host」。用 IP 访问时浏览器发的 Host 就是那个 IP，
    # 这里写死域名反而匹配不上，所有请求会落到默认 server 上。
    server_name _;

    root /opt/share/frontend/dist;
    index index.html;

    client_max_body_size 48m;

    # ---------- 前端：Vue Router history 模式 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端接口 ----------
    # 注意端口是 8081，不是 8080：8080 已经被 nginx 自己占了。
    # proxy_pass 末尾的 "/" 是去掉 /api 前缀的关键，不能漏。
    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- 上传的图片 ----------
    location /images/ {
        alias /data/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, noimageindex" always;

        # 这里故意不配 valid_referers。
        # 防盗链是按域名白名单判断的，而现在访问走的是 IP，任何白名单都匹配不上，
        # 一旦配上就是「自己也被 403」。等换成正式域名再启用。

        access_log off;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
}
